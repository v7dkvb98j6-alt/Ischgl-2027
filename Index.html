<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#161329"><meta name="description" content="Ischgl Männertour 2027 – Live Countdown bis zur Abfahrt">
<title>ISCHGL 2027 | Männertour Countdown</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#100d24;color:white;font-family:system-ui,-apple-system,sans-serif;padding:18px}
.poster{position:relative;isolation:isolate;overflow:hidden;width:min(100%,780px);min-height:620px;border:5px solid #ffcc28;border-radius:22px;text-align:center;padding:38px 18px;background:radial-gradient(ellipse at 50% 15%,#8633af 0%,#3b236e 45%,#10172e 100%);box-shadow:0 0 40px #ec3de44a}
.poster:before{content:"";position:absolute;z-index:-1;bottom:0;left:0;width:100%;height:42%;background:#c9e8ff33;clip-path:polygon(0 68%,12% 36%,22% 65%,38% 15%,55% 70%,70% 27%,83% 58%,94% 24%,100% 46%,100% 100%,0 100%)}
.kicker{color:#ffe364;letter-spacing:.3em;font-size:clamp(13px,3vw,19px);font-weight:900}h1{font-size:clamp(52px,12vw,100px);line-height:1;margin:18px 0 3px;text-shadow:5px 5px #ed398d;font-weight:1000}h2{font-size:clamp(25px,6vw,45px);margin:4px 0 16px;color:#ffda49;letter-spacing:.12em}.emoji{font-size:40px}.subtitle{font-size:clamp(15px,3vw,22px);font-weight:800;margin:18px 0}.timer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:20px auto;max-width:650px}.unit{background:#110d2ce8;border:2px solid #ffdc48;border-radius:12px;padding:16px 2px}.number{font-weight:900;font-variant-numeric:tabular-nums;font-size:clamp(29px,7vw,63px)}.label{font-size:clamp(10px,2.2vw,14px);letter-spacing:.07em;color:#ffd955;font-weight:800}.date{font-size:clamp(19px,4vw,28px);font-weight:900;margin-top:24px}.slogan{font-size:clamp(19px,4vw,28px);color:#ffdf64;font-weight:900;margin-top:24px;text-shadow:2px 2px #ae248b}.foot{font-size:12px;opacity:.8;margin-top:20px}button{background:#ffd84a;border:0;border-radius:99px;color:#1a1232;font-weight:800;padding:12px 20px;margin:16px;cursor:pointer}
@media(max-width:420px){.poster{padding:30px 10px;min-height:570px}.timer{gap:5px}.unit{padding:13px 1px}}
</style></head><body><main class="poster"><div class="emoji">🎿 🍻 🏔️</div><div class="kicker">DIE JUNGS SIND WIEDER UNTERWEGS</div><h1>ISCHGL</h1><h2>MÄNNERTOUR 2027</h2><p class="subtitle">NOCH BIS ZUR ABFAHRT</p><section class="timer" aria-label="Live Countdown"><div class="unit"><div class="number" id="days">---</div><div class="label">TAGE</div></div><div class="unit"><div class="number" id="hours">--</div><div class="label">STUNDEN</div></div><div class="unit"><div class="number" id="minutes">--</div><div class="label">MINUTEN</div></div><div class="unit"><div class="number" id="seconds">--</div><div class="label">SEKUNDEN</div></div></section><div class="date">📅 27.02.2027 · 04:00 UHR</div><div class="slogan">PISTE. PARTY. ESKALATION. 🍺</div><div class="foot" id="status">Live-Countdown · deutsche Zeit</div><button id="share">🔗 Mit den Jungs teilen</button></main>
<script>
const target=Date.parse("2027-02-27T04:00:00+01:00");
function tick(){const s=Math.max(0,Math.floor((target-Date.now())/1000));const values=[Math.floor(s/86400),Math.floor(s/3600)%24,Math.floor(s/60)%60,s%60];["days","hours","minutes","seconds"].forEach((id,i)=>document.getElementById(id).textContent=String(values[i]).padStart(i===0?3:2,"0"));if(s===0)document.getElementById("status").textContent="🎉 Auf nach Ischgl!";}
tick();setInterval(tick,1000);
document.getElementById("share").onclick=async()=>{const data={title:"Ischgl Männertour 2027",text:"🎿🍻 Unser Live-Countdown bis zur Abfahrt!",url:location.href};if(navigator.share){try{await navigator.share(data)}catch(e){}}else if(navigator.clipboard){await navigator.clipboard.writeText(location.href);alert("Link kopiert!");}else alert("Kopiere die Adresse aus deinem Browser.");};
</script></body></html>
