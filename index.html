<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ischgl Männertour 2027 – Live Countdown</title>
<meta name="theme-color" content="#32172e">
<style>
*{box-sizing:border-box}body{margin:0;background:#1c1428;color:#fff;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:grid;place-items:center}
.scene{width:min(100%,1100px);min-height:min(95vh,680px);position:relative;isolation:isolate;overflow:hidden;background:#1d142a url("kuhstall-hintergrund.jpg") center center/cover no-repeat;display:flex;align-items:flex-end;justify-content:center;padding:24px 14px 35px}
.scene:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#11091d05 0%,#14091a10 40%,#14091a9c 67%,#14091ad9 100%);z-index:-1}
.panel{width:min(100%,680px);background:linear-gradient(135deg,#3b1d1df2,#160e22f5);border:3px solid #ffc75e;box-shadow:0 12px 45px #08040dcc,0 0 26px #f627a066;border-radius:16px;padding:15px 12px 18px;text-align:center}
.eyebrow{font-size:clamp(13px,3vw,18px);font-weight:900;letter-spacing:.08em;color:#ffe2a4}.timer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:12px 0}.unit{border:1px solid #ffb4df;background:#120c1e;border-radius:9px;padding:10px 1px}.digits{font-size:clamp(28px,7vw,55px);font-weight:900;font-variant-numeric:tabular-nums;text-shadow:0 0 10px #ff8ad6}.label{font-size:clamp(9px,2.4vw,13px);font-weight:800;color:#ffe39a}.date{font-weight:800;font-size:clamp(14px,3.5vw,19px)}.status{font-size:12px;color:#f9d5e6;margin-top:7px}button{margin-top:12px;background:#ffd15b;color:#2b1524;border:0;border-radius:40px;font-size:14px;font-weight:800;padding:10px 18px;cursor:pointer}
@media(min-width:700px){.scene{border-radius:18px;min-height:690px}}
</style></head><body><main class="scene" aria-label="Après-Ski-Party in Ischgl mit Live-Countdown">
<section class="panel"><div class="eyebrow">🎿 ISCHGL MÄNNERTOUR 2027 🍻</div><div class="timer" role="timer" aria-label="Verbleibende Zeit bis zur Abfahrt">
<div class="unit"><div class="digits" id="days">---</div><div class="label">TAGE</div></div>
<div class="unit"><div class="digits" id="hours">--</div><div class="label">STUNDEN</div></div>
<div class="unit"><div class="digits" id="minutes">--</div><div class="label">MINUTEN</div></div>
<div class="unit"><div class="digits" id="seconds">--</div><div class="label">SEKUNDEN</div></div>
</div><div class="date">ABFAHRT: 27.02.2027 · 04:00 UHR</div><div class="status" id="status">Live-Countdown · deutsche Zeit</div><button id="share">🍻 Link teilen</button></section></main>
<script>
const target=Date.parse("2027-02-27T04:00:00+01:00");
function tick(){let t=Math.max(0,Math.floor((target-Date.now())/1000));let a=[Math.floor(t/86400),Math.floor(t/3600)%24,Math.floor(t/60)%60,t%60];["days","hours","minutes","seconds"].forEach((id,i)=>document.getElementById(id).textContent=String(a[i]).padStart(i===0?3:2,"0"));if(t===0)document.getElementById("status").textContent="🎉 Auf nach Ischgl!";}
tick();setInterval(tick,1000);
document.getElementById("share").addEventListener("click",async()=>{const d={title:"Ischgl Männertour 2027",text:"🎿🍻 Unser Live-Countdown!",url:location.href};if(navigator.share){try{await navigator.share(d)}catch(e){}}else if(navigator.clipboard){await navigator.clipboard.writeText(location.href);alert("Link kopiert!");}});
</script></body></html>
